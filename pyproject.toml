[project]
name = "llm-watermarking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukas Schild", email = "luk.schild@t-online.de" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "flask>=3.0.0",
    "huggingface-hub>=1.32.0",
    "ollama>=0.6.2",
    "openai>=3.16.2",
    "transformers>=5.10.4,<5.17.0",
    "vllm>=0.29.0",
    "vllm-bnb-plugin",
]

[project.scripts]
llm-watermarking = "llm_watermarking:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
